kind = "web"
previewPath = "/"
title = "دليل — مساعد الاستعلام الذكي"
version = "1.0.0"
id = "artifacts/daleel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26027

[services.development]
run = "pnpm --filter @workspace/daleel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daleel", "run", "build" ]
publicDir = "artifacts/daleel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26027"
BASE_PATH = "/"
